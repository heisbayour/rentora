<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1A73E8">
    <title>Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F7F9; color: #1F2937; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        main { max-width: 360px; margin: 16px; padding: 32px 24px; text-align: center; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; }
        img { width: 64px; height: 64px; border-radius: 12px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #6B7280; margin: 0 0 20px; }
        button { height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #1A73E8; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You are offline</h1>
        <p>Check your internet connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
